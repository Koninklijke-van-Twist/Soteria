# Deploy web/ over FTP and publish a release-signed Android APK.
#
# Required repo/org secrets for the android job:
#   ANDROID_KEYSTORE_BASE64   — base64 of the .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD — keystore password
# Optional:
#   ANDROID_KEY_ALIAS         — defaults to "soteria" if empty
#   ANDROID_KEY_PASSWORD      — defaults to ANDROID_KEYSTORE_PASSWORD if empty
#   SOTERIA_API_BASE_URL      — API base URL baked into the APK
# FTP secrets (unchanged): FTP_HOST, FTP_USERNAME, FTP_PASSWORD, FTP_REMOTE_DIR

name: Deploy to FTP and release APK

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Debug env
        run: |
          echo "Host: $FTP_HOST"
          echo "User: $FTP_USERNAME"
          echo "Remote dir: $FTP_REMOTE_DIR"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}

      - name: Deploy web/ to FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" << EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-allow false
          set ftp:passive-mode yes

          cd "$FTP_REMOTE_DIR"

          mirror -R --delete \
            --exclude-glob .htaccess \
            --exclude-glob cache/** \
            --exclude-glob data/** \
            --exclude-glob analytics/*.sqlite \
            --exclude-glob analytics/*.sqlite-* \
            --exclude-glob auth.php \
            ./web .

          set cmd:fail-exit false
          mkdir cache
          mkdir data
          chmod 777 analytics
          chmod 777 cache
          chmod 777 data
          bye
          EOF

      # mirror slaat .htaccess over (de server heeft een eigen root-.htaccess),
      # dus de afscherming van data/ en cache/ gaat apart mee.
      - name: Upload .htaccess protection for data/ and cache/
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" << EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-allow false
          set ftp:passive-mode yes

          cd "$FTP_REMOTE_DIR"
          put ./web/data/.htaccess -o data/.htaccess
          put ./web/cache/.htaccess -o cache/.htaccess
          chmod 644 data/.htaccess
          chmod 644 cache/.htaccess
          bye
          EOF

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Require release-signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=()
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            missing+=("ANDROID_KEYSTORE_BASE64")
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            missing+=("ANDROID_KEYSTORE_PASSWORD")
          fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets for release-signed APK: ${missing[*]}"
            echo "Also optional: ANDROID_KEY_ALIAS (default: soteria), ANDROID_KEY_PASSWORD (default: same as keystore password)."
            exit 1
          fi

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/soteria.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/soteria.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # Empty alias → Gradle defaults to "soteria"; empty key password → keystore password.
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SOTERIA_API_BASE_URL: ${{ secrets.SOTERIA_API_BASE_URL }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK is not Android Debug signed
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Expected signed release APK missing: $APK"
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          APKSIGNER="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found under \$ANDROID_HOME/build-tools"
            exit 1
          fi
          CERTS="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)" || {
            echo "::error::apksigner verify failed"
            echo "$CERTS"
            exit 1
          }
          echo "$CERTS"
          if echo "$CERTS" | grep -Fq "CN=Android Debug"; then
            echo "::error::APK is signed with Android Debug — refusing to publish. Configure release keystore secrets."
            exit 1
          fi
          echo "Signature check passed (not Android Debug)."

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Soteria ${{ github.run_number }}
          body: versionCode=${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
